<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">L</span><span>Library System</span></div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
      <h1>Library Management System</h1>
      <div class="user"><span class="avatar">A</span><span>Admin</span><a href="#">Logout</a></div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panels">
      <div class="card">
        <h2>Books Circulation</h2>
        <div class="legend" id="legend"></div>
        <div class="donut-wrap">
          <svg viewBox="0 0 200 200" class="donut" id="donut" role="img" aria-label="Circulation chart"></svg>
          <div class="donut-center"><strong>60%</strong><span>AVG. Exceptions</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Books Circulation</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Book Name</th><th>Author</th><th>Publication</th><th>Progress</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <footer><span>Library Management System</span><span>Developed by your team</span></footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
